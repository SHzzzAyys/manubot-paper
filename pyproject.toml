[project]
name = "vibe-greet"
version = "0.1.0"
description = "A tiny, agent-friendly vibe greeting CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12,<1.0",
]

[project.scripts]
vibe-greet = "main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
